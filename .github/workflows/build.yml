name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Assemble optimised APK
        run: |
          set -o pipefail
          ./gradlew assembleRelease --console=plain 2>&1 | tee build.log
      - name: Publish build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -E "^e: |error:|FAILURE|What went wrong" -A3 build.log > build-errors.txt || true
          gh release delete build-log --yes --cleanup-tag || true
          gh release create build-log build.log build-errors.txt --title "Build log" --notes "Chyba buildu z ${GITHUB_SHA::7}" --prerelease --target "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: foldlauncher-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk FoldLauncher.apk
          for id in $(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | select(.tag_name=="latest") | .id'); do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/$id" || true
          done
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/latest" || true
          gh release create latest FoldLauncher.apk --title "Fold Launcher APK" --notes "Automatický build z commitu ${GITHUB_SHA::7}" --target "$GITHUB_SHA" --latest --draft=false
          for attempt in 1 2 3 4 5 6; do
            rid=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | select(.tag_name=="latest") | .id' | head -1)
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/$rid" -F draft=false --jq '{id,draft,tag_name}'
            sleep 8
            code=$(curl -s -o /dev/null -L -w "%{http_code}" "https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/FoldLauncher.apk" || true)
            echo "attempt $attempt: download link answers $code"
            [ "$code" = "200" ] && break
          done
